<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Finn din neste bok – Tarkon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    /* iOS Safari fixes */
    button { cursor: pointer; -webkit-appearance: none; appearance: none; }
    a { -webkit-touch-callout: none; }
    * { -webkit-tap-highlight-color: transparent; }
    /* Prevent iOS font size inflation */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #ede4dd; }
    body {
      min-height: 100%;
      background: #ede4dd;
      padding: 2rem 1rem 3rem;
      font-family: 'Lato', sans-serif;
    }
    @media (max-width: 600px) {
      body { padding: 1.2rem 1rem 2rem; }
    }

    #tk {
      background: #f6eae4; color: #1e3940; font-family: 'Lato', sans-serif;
      border-radius: 12px;
      width: 100%; max-width: 520px;
      box-shadow: 0 4px 32px rgba(30,57,64,.10);
      overflow: hidden;
      margin: 0 auto;
    }

    /* INTRO */
    #v-intro { padding: 1.8rem 2rem 1.7rem; }
    .tk-h1 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px; font-weight: 700; color: #1e3940; line-height: 1.2; margin-bottom: .35rem; }
    .tk-lead { font-size: 13px; color: #1e3940; opacity: .7; margin-bottom: 1.3rem; line-height: 1.6; }
    .tk-intro-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    #tk button.tk-start-btn {
      font-family: 'Lato', sans-serif; font-size: 13px;
      background: #ffffff; color: #1e3940;
      border: 0.5px solid rgba(30,57,64,.3); border-radius: 4px;
      padding: .6rem 1.6rem; cursor: pointer; flex-shrink: 0;
      transition: background .2s; -webkit-tap-highlight-color: transparent;
    }
    #tk button.tk-start-btn:hover, #tk button.tk-start-btn:active { background: #f0ebe8; }
    .tk-brand { display: flex; align-items: center; gap: .55rem; flex-shrink: 0; }
    .tk-utviklet { font-family: 'EB Garamond', serif; font-size: 13px; font-style: italic; color: #1e3940; opacity: .55; white-space: nowrap; }
    .tk-logo-wrap svg { display: block; }

    /* QUESTION */
    #v-question { padding: 1.8rem 2rem 1.7rem; }
    .tk-progress { display: flex; gap: 5px; margin-bottom: 1.4rem; }
    .tk-dot { height: 2px; flex: 1; background: rgba(30,57,64,.12); border-radius: 2px; transition: background .4s; }
    .tk-dot.done { background: #1e3940; }
    .tk-dot.active { background: rgba(30,57,64,.45); }
    .tk-nav { display: flex; align-items: center; margin-bottom: 1.2rem; }
    #tk button.tk-back {
      font-family: 'Lato', sans-serif; font-size: 12px; color: #1e3940; opacity: .6;
      background: transparent; border: none; cursor: pointer; padding: 0;
      display: flex; align-items: center; gap: 5px;
      transition: opacity .2s; -webkit-tap-highlight-color: transparent;
    }
    #tk button.tk-back:hover { opacity: 1; }
    #tk button.tk-back svg { width: 12px; height: 12px; }
    .tk-step-label { font-size: 11px; color: #1e3940; opacity: .6; margin-left: auto; letter-spacing: .1em; }
    .tk-q { font-family: 'EB Garamond', serif; font-size: 22px; font-weight: 700; color: #1e3940; line-height: 1.2; margin-bottom: 1.2rem; }
    @media (max-width: 380px) { .tk-q { font-size: 19px; } }

    .tk-answers { display: flex; flex-direction: column; gap: .55rem; }
    .tk-answer-row { display: flex; align-items: stretch; }
    #tk button.tk-answer-btn {
      flex: 1; padding: .85rem 1rem;
      background: #ffffff !important;
      border: 0.5px solid rgba(30,57,64,.18) !important;
      border-right: none !important; border-radius: 6px 0 0 6px;
      cursor: pointer; text-align: left;
      font-family: 'EB Garamond', serif; font-size: 15px; font-weight: 700;
      color: #1e3940 !important; line-height: 1.25; transition: background .18s;
      -webkit-tap-highlight-color: transparent;
    }
    @media (max-width: 380px) { #tk button.tk-answer-btn { font-size: 14px; } }
    #tk button.tk-answer-btn:hover,
    #tk button.tk-answer-btn:active { background: #f2eeec !important; }
    #tk button.tk-answer-btn.sel {
      background: #1e3940 !important; border-color: #1e3940 !important; color: #f6eae4 !important;
    }

    .tk-hint-wrap { position: relative; flex-shrink: 0; }
    #tk button.tk-hint-btn {
      width: 42px; height: 100%;
      background: #ffffff !important;
      border: 0.5px solid rgba(30,57,64,.18) !important;
      border-left: 0.5px solid rgba(30,57,64,.08) !important;
      border-radius: 0 6px 6px 0;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #1e3940; opacity: .45; padding: 0;
      transition: opacity .2s, background .18s; -webkit-tap-highlight-color: transparent;
    }
    #tk button.tk-hint-btn:hover,
    #tk button.tk-hint-btn:active { opacity: 1; background: #f2eeec !important; }
    #tk button.tk-hint-btn svg { width: 20px; height: 20px; }

    .tk-tooltip {
      display: none; position: absolute;
      right: calc(100% + 8px); top: 50%; transform: translateY(-50%);
      background: #1e3940; color: #f6eae4; border-radius: 5px;
      padding: .55rem .8rem; font-size: 11px; line-height: 1.6;
      width: 190px; z-index: 20; pointer-events: none;
    }
    .tk-tooltip::after {
      content: ''; position: absolute; top: 50%; left: 100%; transform: translateY(-50%);
      border: 5px solid transparent; border-left-color: #1e3940;
    }
    .tk-hint-wrap:hover .tk-tooltip,
    .tk-hint-wrap.tip-open .tk-tooltip { display: block; }

    .tk-quote { margin-top: 1.6rem; padding-top: 1.4rem; border-top: 0.5px solid rgba(30,57,64,.15); text-align: center; }
    .tk-quote-text { font-family: 'EB Garamond', serif; font-size: 15px; font-style: italic; color: #1e3940; opacity: .78; line-height: 1.7; max-width: 34em; margin: 0 auto; }
    .tk-quote-author { font-family: 'Lato', sans-serif; font-size: 11px; color: #1e3940; opacity: .55; margin-top: .5rem; letter-spacing: .04em; }

    /* RESULTS */
    #v-results { padding: 1.8rem 0 1.7rem; }
    .tk-res-nav { padding-left: 2rem; padding-right: 2rem; margin-bottom: 1.1rem; }
    .tk-res-label { font-family: 'EB Garamond', serif; font-size: 20px; font-weight: 700; color: #1e3940; opacity: .9; margin-bottom: .45rem; line-height: 1.25; padding-left: 2rem; padding-right: 2rem; }
    .tk-res-intro { font-family: 'Lato', sans-serif; font-size: 12.5px; color: #1e3940; opacity: .65; line-height: 1.65; margin-bottom: 1.3rem; padding-left: 2rem; padding-right: 2rem; }
    .tk-sec-label { font-family: 'EB Garamond', serif; font-size: 16px; font-weight: 700; color: #1e3940; opacity: .7; margin-bottom: .7rem; padding-left: 2rem; padding-right: 2rem; }
    .tk-bottom-wrap { padding-left: 2rem; padding-right: 2rem; }

    .tk-books {
      display: flex; gap: .8rem; overflow-x: auto;
      padding: 0 2rem 8px; margin-bottom: 1.4rem;
      scrollbar-width: thin; scrollbar-color: rgba(30,57,64,.2) transparent;
      -webkit-overflow-scrolling: touch;
    }
    .tk-books::-webkit-scrollbar { height: 3px; }
    .tk-books::-webkit-scrollbar-thumb { background: rgba(30,57,64,.2); border-radius: 2px; }

    #tk a.tk-book, #tk div.tk-book {
      flex: 0 0 auto;
      /* ~2.5 cards visible: (viewport - 2*padding - gaps) / 2.5 */
      width: clamp(130px, calc(38vw - 1rem), 155px);
      background: #ffffff !important;
      border: 0.5px solid rgba(30,57,64,.12); border-radius: 6px;
      overflow: hidden; display: flex; flex-direction: column;
      text-decoration: none; color: #1e3940; transition: transform .2s ease;
      -webkit-tap-highlight-color: transparent; cursor: pointer;
    }
    #tk a.tk-book:hover, #tk div.tk-book:hover { transform: translateY(-3px); }

    .tk-cover-frame {
      width: 100%; background: #ffffff; padding: 6px 6px 3px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .tk-cover-inner {
      width: 100%; height: clamp(120px, calc(52vw - 2rem), 158px);
      display: flex; align-items: center; justify-content: center;
      position: relative; background: #ffffff; border-radius: 2px; overflow: hidden;
    }
    .tk-book-cover { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; }
    .tk-book-cover-fb {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: 'EB Garamond', serif; font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,.92); text-align: center; padding: 1rem; line-height: 1.3;
      background: inherit;
    }

    .tk-book-body { padding: .65rem .8rem .75rem; display: flex; flex-direction: column; gap: .18rem; flex: 1; }
    .tk-book-genre { font-size: 9px; letter-spacing: .1em; color: #1e3940; opacity: .5; }
    .tk-book-title { font-family: 'EB Garamond', serif; font-size: 14px; font-weight: 700; line-height: 1.2; color: #1e3940; }
    .tk-book-author { font-size: 11px; color: #1e3940; opacity: .6; }
    .tk-book-desc { font-size: 11px; color: #1e3940; opacity: .75; line-height: 1.5; flex: 1; margin-top: 3px; }
    #tk .tk-book-more {
      font-size: 10px; color: #1e3940; opacity: .55;
      background: transparent; border: none; cursor: pointer; padding: 0;
      text-decoration: underline; text-underline-offset: 2px;
      text-align: left; margin-top: 5px; transition: opacity .2s;
      -webkit-tap-highlight-color: transparent; display: inline-block;
    }
    #tk .tk-book-more:hover { opacity: 1; }

    .tk-sec-label { font-family: 'EB Garamond', serif; font-size: 16px; font-weight: 700; color: #1e3940; opacity: .7; margin-bottom: .7rem; }
    .tk-sec-books {
      display: flex; gap: .65rem; overflow-x: auto;
      padding: 0 2rem 6px; margin-bottom: 1.3rem;
      scrollbar-width: thin; scrollbar-color: rgba(30,57,64,.15) transparent;
      -webkit-overflow-scrolling: touch;
    }
    .tk-sec-books::-webkit-scrollbar { height: 2px; }
    .tk-sec-books::-webkit-scrollbar-thumb { background: rgba(30,57,64,.15); border-radius: 2px; }

    #tk a.tk-sec-book {
      flex: 0 0 auto; width: 126px;
      background: rgba(255,255,255,.6) !important;
      border: 0.5px solid rgba(30,57,64,.1); border-radius: 6px;
      overflow: hidden; display: flex; flex-direction: column;
      text-decoration: none; color: #1e3940; transition: transform .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #tk a.tk-sec-book:hover { transform: translateY(-2px); background: #ffffff !important; }

    .tk-sec-cover-frame { width: 100%; background: #ffffff; padding: 6px 6px 3px; display: flex; align-items: center; justify-content: center; }
    .tk-sec-cover-inner { width: 100%; height: 135px; display: flex; align-items: center; justify-content: center; position: relative; background: #ffffff; border-radius: 2px; overflow: hidden; }

    .tk-sec-body { padding: .55rem .65rem .65rem; display: flex; flex-direction: column; gap: .12rem; }
    .tk-sec-genre { font-size: 8px; letter-spacing: .1em; color: #1e3940; opacity: .4; }
    .tk-sec-title { font-family: 'EB Garamond', serif; font-size: 12px; font-weight: 700; line-height: 1.2; color: #1e3940; }
    .tk-sec-author { font-size: 10px; color: #1e3940; opacity: .5; }
    .tk-sec-desc { font-size: 10px; color: #1e3940; opacity: .62; line-height: 1.45; margin-top: 2px; }

    .tk-bottom { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding-bottom: 0; }
    #tk button.tk-reset {
      font-size: 12px; color: #1e3940; opacity: .8;
      background: #ffffff !important; border: 0.5px solid rgba(30,57,64,.25); border-radius: 4px;
      padding: .4rem 1rem; cursor: pointer; transition: opacity .2s;
      -webkit-tap-highlight-color: transparent;
    }
    #tk button.tk-reset:hover { opacity: 1; }
    .tk-shop-link { font-size: 12px; color: #1e3940; opacity: .65; text-decoration: underline; text-underline-offset: 2px; }
    .tk-shop-link:hover { opacity: 1; }

    .tk-view { display: none; }
    .tk-view.on { display: block; }
    @keyframes tkFade { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .tk-fade { animation: tkFade .32s ease forwards; }
  </style>
</head>
<body>
<div id="tk">
  <div id="v-intro" class="tk-view on">
    <h1 class="tk-h1">Finn din neste bok</h1>
    <p class="tk-lead">Fire spørsmål. Bøker som treffer det du faktisk er ute etter.</p>
    <div class="tk-intro-row">
      <button class="tk-start-btn" id="tk-start-btn" onclick="tkStart()">Kom i gang →</button>
      <div class="tk-brand">
        <span class="tk-utviklet">Utviklet av</span>
        <div class="tk-logo-wrap" id="tk-logo-wrap">
          <svg viewBox="0 0 283.5 141.7" xmlns="http://www.w3.org/2000/svg">

            <path class="st1" d="M105.7,58.9h-6.4v28c0,5.1,2.3,5.7,2.8,5.8H90.1c0.5-0.1,2.8-0.6,2.8-5.8v-28h-7c-4,0-4.9,2.2-6.1,4.9c0.3-3,0.5-5.9,0.7-8.9h31.3l0.7,8.9C111.5,61,110.4,58.9,105.7,58.9z"/>

  <div id="v-question" class="tk-view">
    <div class="tk-progress" id="tk-progress"></div>
    <div class="tk-nav">
      <button class="tk-back" id="tk-back-btn" onclick="tkBack()">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2L4 6l4 4"/></svg>Tilbake
      </button>
      <span class="tk-step-label" id="tk-step-lbl"></span>
    </div>
    <h2 class="tk-q" id="tk-q-text"></h2>
    <div class="tk-answers" id="tk-answers"></div>
    <div class="tk-quote">
      <div class="tk-quote-text" id="tk-quote-text"></div>
      <div class="tk-quote-author" id="tk-quote-author"></div>
    </div>
  </div>

  <div id="v-results" class="tk-view">
    <div class="tk-res-nav">
      <div class="tk-nav" style="margin-bottom:0">
        <button class="tk-back" onclick="tkBackFromResults()">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2L4 6l4 4"/></svg>Tilbake
        </button>
      </div>
    </div>
    <h2 class="tk-res-label">Her er noen verdener som treffer deg</h2>
    <p class="tk-res-intro" id="tk-res-intro"></p>
    <div class="tk-books" id="tk-books"></div>
    <p class="tk-sec-label">Andre som kanskje passer deg</p>
    <div class="tk-sec-books" id="tk-sec-books"></div>
    <div class="tk-bottom tk-bottom-wrap">
      <button class="tk-reset" onclick="tkReset()">Start på nytt</button>
      <a class="tk-shop-link" id="tk-shop-href" href="https://tarkon.no/collections/boker" target="_blank">Se hele boksamlingen på tarkon.no →</a>
    </div>
  </div>
</div>


<script>
function scaleLogoToBtn(){
  const btn=document.getElementById('tk-start-btn'),wrap=document.getElementById('tk-logo-wrap');
  if(!btn||!wrap)return;
  const h=btn.offsetHeight;if(!h)return;
  const tH=Math.round(h*1.4),tW=Math.round(tH*(283.5/141.7));

// ±10% jitter on book attribute values for dynamic scoring
function jitter(v){ return v > 0 ? v * (0.9 + Math.random()*0.2) : 0; }

// Manual boosts for titles that need help competing
const BOOSTS={
  "Red Rising":1.5,"Alchemised":1.5,"A Curse Carved in Bone":1.5,"Lightlark":1.5,
  "The Martian":3.0,"Project Hail Mary":3.0,"Ready Player One":3.0,
  "The Hitchhiker's Guide to the Galaxy":3.0,"The Colour Of Magic":6.0,
  "Shadow and Bone":4.0,"Throne of Glass":2.0,
  "Dungeon Crawler Carl":2.5,"Dark Matter":2.5,
  "The Atlas Six":2.0,"Starter Villain":2.0,"Snow Crash":2.0,
  "Wicked":2.0,"Elantris":1.5
};

function scoreBook(b, tags) {
  const dark    = tags.dark    || 0;
  const epic    = tags.epic    || 0;
  const literary= tags.literary|| 0;
  const pager   = tags.pager   || 0;
  const char_   = tags.char    || 0;
  const world   = tags.world   || 0;

  // Dynamic char weight: when pager dominates, reduce char influence
  // so action/thriller books can compete against high-char romance books
  let char_w = 2.5;
  if(pager > 0 && pager >= char_) {
    char_w = Math.max(1.0, 2.5 * char_ / (pager + char_ + 1));
  }

  const bd=jitter(b.dark),be=jitter(b.epic),bl=jitter(b.literary);
  const bp=jitter(b.pager),bc=jitter(b.char),bw=jitter(b.world);
  const bt=jitter(b.tempo),bv=jitter(b.vansk),bm=jitter(b.moerk);
  const br=jitter(b.romantisk),bn=jitter(b.tankev),ba=jitter(b.action);

  let s = 0;
  s += bd*dark*2.5 + be*epic*2.5 + bl*literary*2.5;
  s += bp*pager*2.5 + bc*char_*char_w + bw*world*2.5;

  // Nuance bonuses
  s += bm*dark*0.8;      // mørk tone matches dark
  s += bn*literary*1.0;  // tankevekkende matches literary
  s += br*char_*0.8;     // romantisk matches char
  s += be*world*0.5;     // epic adds to world

  // Pager: tempo and action bonus scaled with how much user wants pager
  if(pager > 0) {
    s += bt * pager * 0.5;
    s += ba * pager * 0.4;
    s += (4-bv) * 0.5;
  }

  // Literary sci-fi bonus: pulls classics like Foundation, Le Guin up
  if(literary > 0 && b.scifi && bl >= 2) s += literary * 1.5;
  // Epic sci-fi bonus
  if(epic > 0 && b.scifi && be >= 2) s += epic * 0.8;

  s += b.pop * 0.4;
  s += (BOOSTS[b.title] || 0);

  return s;
}

function buildIntroText(tags) {
  const dark=tags.dark||0, epic=tags.epic||0, literary=tags.literary||0;
  const pager=tags.pager||0, char_=tags.char||0, world=tags.world||0;

  const top = [
    ['dark',dark],['epic',epic],['literary',literary],
    ['pager',pager],['char',char_],['world',world]
  ].sort((a,b)=>b[1]-a[1])[0][0];

  const intros={
    dark:["Du er ute etter mørkt og intenst. Her er bøker som ikke holder tilbake – fulle av uhygge, spenning og historier som sitter igjen.","Mørke stemninger og intense fortellinger. Disse bøkene trekker deg inn i ubehaget og slipper deg ikke.","Gothic, grimdark og horror – bøker som utforsker det mørke i mennesket og verden rundt det."],
    epic:["Store verdener, episke konflikter og historier som strekker seg over hundrevis av sider. Her er dine neste reiser.","Du vil ha noe å forsvinne inn i. Disse bøkene gir deg univers du kan leve i lenge etter siste side.","Episke sagaer med politikk, krig og skjebner som henger i balansen. Perfekt for den store lesereisen."],
    literary:["Bøker som gir deg noe å tenke på lenge etter at du har lagt dem fra deg. Tankevekkende og varig.","Du vil ha noe som utfordrer deg. Disse titlene kombinerer stor litterær kvalitet med ideer som setter seg.","Filosofiske og tankevekkende fortellinger som stiller de store spørsmålene – uten enkle svar."],
    pager:["Bøker du ikke klarer å legge fra deg. Raskt i gang, umulig å avslutte – perfekt for en helg.","Du vil ha driv og tempo. Disse titlene tar tak fra første side og slipper ikke taket.","Tilgjengelige og engasjerende – bøker som minner deg på hvorfor du liker å lese."],
    char:["Du husker karakterene lenge etter historien er glemt. Disse bøkene er fulle av slike møter.","Relasjoner, følelser og karakterer du heier på. Her er bøker der menneskene er det viktigste.","Sterke protagonister og uforglemmelige vennskap. Bøker der du investerer alt i karakterene."],
    world:["Verdener så detaljerte og rike at du vil bo der. Kart, lore og magisystemer som holder deg fanget.","Du vil ha et univers å utforske. Disse titlene gir deg verdener som er minst like viktige som plottet.","Worldbuilding på høyeste nivå – bøker der settingen er like viktig som karakterene."]
  };
  const pool=intros[top]||intros.epic;
  return pool[Math.floor(Math.random()*pool.length)];
}

// Wildcard pool: books that rarely show but deserve visibility
const WILDCARDS=new Set([
  "Dark Matter","Starter Villain","Snow Crash","Altered Carbon",
  "Artemis","The Time Machine","The War of the Worlds","Wicked",
  "City & Its Uncertain Walls","The Windup Girl","Elantris",
  "A Knight of the Seven Kingdoms","A Sorceress Comes to Call",
  "Frost","Rose in Chains","Shield of Sparrows","Spellbound",
  "The Atlas Six","Secret of Secrets"
]);

function getTopBooks(tags, nPrimary=6, nSecondary=4) {
  const scored = BOOKS.map(b => ({...b, _score: scoreBook(b, tags)}));
  scored.sort((a,b) => b._score - a._score);

  const ROMANTASY_AUTHORS = new Set([
    "Yarros","Maas","Ross","Hart","Arena","Perry","Soto","Nicole","Aster",
    "Allen","Sorensen","Hamm","Wilson","Garber","Crawford","Kova","Bardugo",
    "Jensen","Raasch","Warwick","Lake","Leighton","Palphreyman","Deonn","Novik"
  ]);
  function lastName(author){return author.split(' ').pop();}
  function isRomantasy(b){return ROMANTASY_AUTHORS.has(lastName(b.author));}

  // Dynamic romantasy cap: allow 3 when char+pager strongly dominate
  const char_=tags.char||0, pager_=tags.pager||0;
  const dark_=tags.dark||0, lit_=tags.literary||0;
  const romantasyMax = (char_+pager_) > (dark_+lit_)*1.5 ? 3 : 2;

  const primary=[], authorCount={};
  let romantasyCount=0;
  for(const b of scored){
    const ln=lastName(b.author);
    if((authorCount[ln]||0)>=2) continue;
    if(isRomantasy(b) && romantasyCount>=romantasyMax) continue;
    primary.push(b);
    authorCount[ln]=(authorCount[ln]||0)+1;
    if(isRomantasy(b)) romantasyCount++;
    if(primary.length>=nPrimary) break;
  }

  const usedTitles=new Set(primary.map(b=>b.title));
  const secondary=[];
  for(const b of scored){
    if(!usedTitles.has(b.title) && secondary.length<nSecondary){
      secondary.push(b);
      usedTitles.add(b.title);
    }
  }

  // Wildcard: 40% chance to swap last secondary with a relevant wildcard
  if(Math.random() < 0.4){
    const topScore = scored[0]._score;
    const minScore = topScore * 0.35;
    const candidates = scored.filter(b =>
      WILDCARDS.has(b.title) && !usedTitles.has(b.title) && b._score >= minScore
    );
    if(candidates.length > 0){
      const pool = candidates.slice(0, 3);
      const pick = pool[Math.floor(Math.random() * pool.length)];
      secondary[secondary.length-1] = pick;
    }
  }

  return {primary, secondary};
}

let cur=0, picks=[], combinedTags={};

function tkShow(id){
  document.querySelectorAll('.tk-view').forEach(v=>v.classList.remove('on','tk-fade'));
  const el=document.getElementById(id);el.classList.add('on','tk-fade');
}
function tkStart(){cur=0;picks=[];combinedTags={};tkRenderQ();tkShow('v-question');}
function tkReset(){
  const booksEl=document.getElementById('tk-books');
  const secEl=document.getElementById('tk-sec-books');
  if(booksEl)booksEl.scrollLeft=0;
  if(secEl)secEl.scrollLeft=0;
  tkShow('v-intro');setTimeout(scaleLogoToBtn,80);
}
function tkBack(){
  if(cur===0){tkShow('v-intro');setTimeout(scaleLogoToBtn,80);return;}
  cur--;picks.pop();rebuildTags();tkRenderQ();
}
function tkBackFromResults(){cur=QS.length-1;tkRenderQ();tkShow('v-question');}
function rebuildTags(){
  combinedTags={};
  picks.forEach(t=>Object.entries(t).forEach(([k,v])=>{combinedTags[k]=(combinedTags[k]||0)+v;}));
}

function tkRenderQ(){
  const q=QS[cur],qt=nextQ();
  document.getElementById('tk-step-lbl').textContent=`${cur+1} / ${QS.length}`;
  document.getElementById('tk-q-text').textContent=q.text;
  document.getElementById('tk-back-btn').style.visibility=cur===0?'hidden':'visible';
  document.getElementById('tk-quote-text').innerHTML=qt.q.replace(/\n/g,'<br>');
  document.getElementById('tk-quote-author').textContent='— '+qt.a;
  const prog=document.getElementById('tk-progress');prog.innerHTML='';
  QS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='tk-dot'+(i<cur?' done':i===cur?' active':'');
    prog.appendChild(d);
  });
  const cont=document.getElementById('tk-answers');cont.innerHTML='';
  q.answers.forEach(a=>{
    const isSel=picks[cur]&&JSON.stringify(picks[cur])===JSON.stringify(a.tags);
    const row=document.createElement('div');row.className='tk-answer-row';
    const btn=document.createElement('button');
    btn.className='tk-answer-btn'+(isSel?' sel':'');
    btn.textContent=a.label;
    btn.onclick=()=>tkPick(a.tags);
    const hw=document.createElement('div');hw.className='tk-hint-wrap';
    hw.innerHTML=`<button class="tk-hint-btn" aria-label="Hint"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="8"/><circle cx="10" cy="14.5" r="1" fill="currentColor" stroke="none"/><path d="M7.5 7.8c0-1.8 4.5-1.8 4.5 0.8C12 10.5 10 11 10 12.5"/></svg></button><div class="tk-tooltip">${a.hint.replace(/\n/g,'<br>')}</div>`;
    row.appendChild(btn);row.appendChild(hw);cont.appendChild(row);
  });
}

function tkPick(tags){
  picks[cur]=tags;rebuildTags();cur++;
  if(cur<QS.length){tkRenderQ();}else{tkShowResults();}
}

const GITHUB_BASE="https://krystavos.github.io/Bookfinder/";

function mkCover(b,isPrimary){
  const frame=document.createElement('div');
  frame.className=isPrimary?'tk-cover-frame':'tk-sec-cover-frame';
  const inner=document.createElement('div');
  inner.className=isPrimary?'tk-cover-inner':'tk-sec-cover-inner';
  const fb=document.createElement('div');fb.className='tk-book-cover-fb';
  fb.style.background=b.color;fb.textContent=b.title;inner.appendChild(fb);
  if(b.isbn){
    const img=new Image();img.alt=b.title;
    const t=setTimeout(()=>{img.src='';},5000);
    img.onload=()=>{clearTimeout(t);img.className='tk-book-cover';inner.innerHTML='';inner.appendChild(img);};
    img.onerror=()=>{clearTimeout(t);};
    img.src=GITHUB_BASE+b.isbn+'.png';
  }
  frame.appendChild(inner);return frame;
}

function tkShowResults(){
  const {primary, secondary} = getTopBooks(combinedTags);
  document.getElementById('tk-res-intro').textContent=buildIntroText(combinedTags);
  document.getElementById('tk-shop-href').href='https://tarkon.no/collections/boker';

  const booksEl=document.getElementById('tk-books');booksEl.innerHTML='';
  primary.forEach((b,i)=>{
    const card=document.createElement('a');card.className='tk-book';
    card.href=b.url;card.target='_blank';
    const body=document.createElement('div');body.className='tk-book-body';
    body.innerHTML=`<div class="tk-book-title">${b.title}</div><div class="tk-book-author">${b.author}</div><div class="tk-book-desc">${b.desc}</div>`;
    card.appendChild(mkCover(b,true));card.appendChild(body);booksEl.appendChild(card);
  });

  const secEl=document.getElementById('tk-sec-books');secEl.innerHTML='';
  secondary.forEach(b=>{
    const card=document.createElement('a');card.className='tk-sec-book';card.href=b.url;card.target='_blank';
    const body=document.createElement('div');body.className='tk-sec-body';
    body.innerHTML=`<div class="tk-sec-title">${b.title}</div><div class="tk-sec-author">${b.author}</div><div class="tk-sec-desc">${b.desc}</div>`;
    card.appendChild(mkCover(b,false));card.appendChild(body);secEl.appendChild(card);
  });

  booksEl.scrollLeft=0;secEl.scrollLeft=0;
  tkShow('v-results');
}
